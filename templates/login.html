<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 瓷影新生</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 使用 flex 实现真正的全屏居中 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;      /* 垂直居中 */
            justify-content: center;  /* 水平居中 */
            overflow: auto;           /* 防止内容溢出时滚动 */
        }

        /* 登录卡片 */
        .login-card {
            width: 420px;
            max-width: 90%;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(2px);
            transition: all 0.2s ease;
        }

        /* 标题栏（无拖拽功能，仅为视觉） */
        .card-header {
            background: #4a6cf7;
            padding: 18px 24px;
            border-radius: 20px 20px 0 0;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }

        .card-header h2 {
            font-size: 1.5rem;
            margin: 0;
        }

        .card-header .badge {
            font-size: 0.75rem;
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 30px;
        }

        /* 表单内容 */
        .card-content {
            padding: 30px 28px 36px;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.2s;
            background: #f9f9fc;
        }

        .input-group input:focus {
            outline: none;
            border-color: #4a6cf7;
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.2);
            background: white;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #4a6cf7;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 12px;
        }

        .login-btn:hover {
            background: #3a5ae0;
        }

        .error-msg {
            background: #fee2e2;
            color: #d32f2f;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            text-align: center;
            display: none;
        }

        .register-link {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: #666;
        }

        .register-link a {
            color: #4a6cf7;
            text-decoration: none;
            font-weight: 500;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .footer-note {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 0.8rem;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="card-header">
        <h2>瓷影新生 · 登录</h2>
        <span class="badge">安全登录</span>
    </div>
    <div class="card-content">
        <div class="error-msg" id="errorMsg"></div>
        <form id="loginForm">
            <div class="input-group">
                <label>用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="off" required>
            </div>
            <div class="input-group">
                <label>密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="login-btn">登 录</button>
        </form>
        <div class="register-link">
            还没有账号？ <a href="/register">立即注册</a>
        </div>
    </div>
</div>
<div class="footer-note">
    瓷影新生 | 点云修复系统
</div>

<script>
    // 登录逻辑（与后端兼容）
    const loginForm = document.getElementById('loginForm');
    const errorMsgDiv = document.getElementById('errorMsg');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) {
            showError('请填写用户名和密码');
            return;
        }

        const submitBtn = loginForm.querySelector('.login-btn');
        const originalText = submitBtn.innerText;
        submitBtn.innerText = '登录中...';
        submitBtn.disabled = true;

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    username: username,
                    password: password
                })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                window.location.href = '/';
            } else {
                showError(data.error || data.message || '用户名或密码错误');
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
            }
        } catch (err) {
            console.error('登录请求失败:', err);
            showError('网络错误，请稍后重试');
            submitBtn.innerText = originalText;
            submitBtn.disabled = false;
        }
    });

    function showError(msg) {
        errorMsgDiv.innerText = msg;
        errorMsgDiv.style.display = 'block';
        setTimeout(() => {
            errorMsgDiv.style.display = 'none';
        }, 3000);
    }
</script>
</body>
</html>
